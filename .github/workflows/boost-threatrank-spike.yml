name: boost-threatrank-spike

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # The module forwards this into the enricher container, which turns on
      # ThreatRank Pro mode (LLM justification / fix / attack scenario).
      GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: BoostSecurity scan
        uses: boostsecurityio/boostsec-scanner-github@v4
        with:
          api_endpoint: https://api.dev.boostsec.io
          api_token: ${{ secrets.BOOST_API_KEY }}
          registry_module: boostsecurityio/trivy-fs
          scanner_id: trivy-fs-threatrank-spike
          log_level: TRACE
          additional_args: >-
            --registry
            https://github.com/lindycoder/scanner-registry.git#spike-338-threatrank
